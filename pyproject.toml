[project]
name = "dbdnlp"
version = "0.1.0"
description = "Solve and differentiate parametric nonlinear programs in CasADi, including at degenerate solutions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "casadi>=3.7.2",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]